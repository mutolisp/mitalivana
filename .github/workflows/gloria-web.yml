# GLORIA web app (web/gloria) → GitHub Pages, at /<repo>/gloria/.
#
# Builds the PWA, tests it, builds the Tracheophyta species subsets from the
# published tw-taicol and jp-ylist modules (no Git LFS, no backend venv), and deploys.
# Repository settings → Pages → Source must be "GitHub Actions".
name: gloria-web

on:
  push:
    branches: [main]
    paths:
      - 'web/gloria/**'
      - 'mobile/app/src/**'
      - 'mobile/app/app/gloria/**'
      - 'mobile/app/app/report/**'
      - 'mobile/app/theme.tokens.js'
      - 'backend/scripts/datasets/build_web_species.py'
      - '.github/workflows/gloria-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gloria-web-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/gloria
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: actions/setup-node@v7
        with:
          # npm ci checks every optional dependency is in the lock file. npm
          # 11.6 drops rolldown's wasm-fallback deps (@emnapi/*) when it writes
          # the lock ("Missing … from lock file" here); write it with npm ≥ 11.19.
          node-version: 24
          cache: npm
          cache-dependency-path: web/gloria/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install
        run: npm ci

      - name: Species subsets from the published tw-taicol and jp-ylist modules
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/modules"
          mkdir -p "$tmp"
          ua="gloria-web-ci"
          curl -fsSL --retry 3 -A "$ua" https://data.mitalivana.org/checklists/latest/manifest.json -o "$tmp/manifest.json"
          field() { python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(next(x[sys.argv[3]] for x in d['datasets'] if x['id']==sys.argv[2]))" "$tmp/manifest.json" "$1" "$2"; }
          for id in tw-taicol jp-ylist; do
            curl -fsSL --retry 3 -A "$ua" "$(field "$id" url)" -o "$tmp/$id.db.zip"
            echo "$(field "$id" md5)  $tmp/$id.db.zip" | md5sum -c -
            unzip -o -q "$tmp/$id.db.zip" -d "$tmp"
          done
          cd "$GITHUB_WORKSPACE"
          python3 -m backend.scripts.datasets.build_web_species \
            --module "$tmp/tw-taicol.db" --out web/gloria/public/data --verify
          python3 -m backend.scripts.datasets.build_web_species --dataset jp-ylist \
            --module "$tmp/jp-ylist.db" --out web/gloria/public/data --verify

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Served at https://<owner>.github.io/<repo>/gloria/ : the site root of
      # the Pages artifact holds the app in its gloria/ folder.
      - name: Build
        env:
          GLORIA_BASE: /${{ github.event.repository.name }}/gloria/
        run: |
          npx vite build
          rm -rf "$RUNNER_TEMP/site"
          mkdir -p "$RUNNER_TEMP/site/gloria"
          cp -R dist/. "$RUNNER_TEMP/site/gloria/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
